<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="COOLTOUR.KZ — путешествия по Казахстану, Узбекистану, Кыргызстану и Таджикистану. 14 идей для маршрутов: города Шёлкового пути, озёра, горы и пустыни. Подбор программы и стоимости через WhatsApp." /><meta name="theme-color" content="#0c0a07" /><meta property="og:title" content="COOLTOUR.KZ — откройте Центральную Азию" /><meta property="og:description" content="Четыре страны, четырнадцать маршрутов. Подберём программу путешествия под ваши даты." /><meta property="og:type" content="website" />
<title>COOLTOUR.KZ — путешествия по Центральной Азии</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Unbounded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ============ ТОКЕНЫ И БАЗА ============ */
:root{
  --ink:#0c0a07; --ink2:#121009; --coal:#1a1610; --coal2:#241e14;
  --line:rgba(237,228,211,.12); --sand:#ede4d3; --sand2:#a89d85;
  --gold:#e2a24b; --clay:#c97c31; --lake:#5fa8a0;
  --ease:cubic-bezier(.22,1,.36,1);
  --d:"Unbounded",system-ui,sans-serif; --b:"Manrope",system-ui,sans-serif; --s:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--sand);font-family:var(--b);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button{font-family:var(--b);cursor:pointer;background:none;border:none;color:inherit}
ul{list-style:none}
::selection{background:var(--gold);color:var(--ink)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:#2e281c;border-radius:8px}
.container{max-width:1440px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.container{padding:0 40px}}
.d{font-family:var(--d)}
.gold{color:var(--gold)}
.outline{color:transparent;-webkit-text-stroke:1px rgba(237,228,211,.5)}
.outline-gold{color:transparent;-webkit-text-stroke:1px rgba(226,162,75,.7)}
.serif{font-family:var(--s);font-style:italic;text-transform:none;letter-spacing:0;color:var(--gold)}
.section{padding:90px 0}
@media(min-width:768px){.section{padding:140px 0}}
.sec{scroll-margin-top:90px}
.ov{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.ov::before{content:"";width:40px;height:1px;background:var(--gold)}
.h2{font-family:var(--d);font-weight:800;text-transform:uppercase;line-height:1.02;font-size:clamp(32px,5vw,58px)}
.mut{color:var(--sand2)}

/* зерно */
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:80;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(-1%,2%)}100%{transform:translate(2%,-1%)}}

/* появление при скролле */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:16px 28px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transition:.3s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px;transition:transform .3s}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--sand)}
.btn-gold:hover svg{transform:translate(2px,-2px)}
.btn-ghost{border-color:rgba(237,228,211,.3);color:var(--sand);backdrop-filter:blur(4px)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-light{background:var(--sand);color:var(--ink);padding:10px 20px;font-size:12px}
.btn-light:hover{background:var(--gold)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);color:var(--sand);transition:.3s}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn svg{width:20px;height:20px}

/* ============ ШАПКА ============ */
.nav{position:fixed;inset:0 0 auto;z-index:50;transition:.5s;border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(12,10,7,.85);backdrop-filter:blur(16px);border-color:var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
@media(min-width:768px){.nav-inner{height:80px}}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--gold);color:var(--ink);transition:transform .5s}
.brand:hover .brand-mark{transform:rotate(-12deg)}
.brand-mark svg{width:20px;height:20px}
.brand-text{font-family:var(--d);font-size:13px;font-weight:700;letter-spacing:.14em}
@media(min-width:768px){.brand-text{font-size:16px}}
.nav-links{display:none;gap:32px}
@media(min-width:1024px){.nav-links{display:flex}}
.nav-links a{position:relative;font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sand2);transition:.3s}
.nav-links a:hover{color:var(--sand)}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--gold);transition:.3s}
.nav-links a:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-cta{display:none}
@media(min-width:1024px){.nav-cta{display:inline-flex}}
.nav-burger{display:grid}
@media(min-width:1024px){.nav-burger{display:none}}
.lang{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(12,10,7,.6);backdrop-filter:blur(8px)}
.lang svg{width:14px;height:14px;color:var(--gold);margin:0 4px;display:none}
@media(min-width:640px){.lang svg{display:block}}
.lang button{padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--sand2);transition:.3s}
.lang button:hover{color:var(--sand)}
.lang button.on{background:var(--gold);color:var(--ink)}

/* мобильное меню */
.mm{position:fixed;inset:0;z-index:60;background:rgba(12,10,7,.97);backdrop-filter:blur(24px);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .35s}
.mm.open{opacity:1;pointer-events:auto}
.mm-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px}
.mm-nav{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:8px}
.mm-nav a{font-family:var(--d);font-weight:700;text-transform:uppercase;font-size:clamp(28px,7vw,44px);line-height:1.15;opacity:0;transform:translateY(30px);transition:.5s var(--ease)}
.mm.open .mm-nav a{opacity:1;transform:none}
.mm-nav a span{color:var(--gold);font-size:14px;margin-right:16px}
.mm-nav a:hover{color:var(--gold)}
.mm-foot{padding:0 32px 40px;display:flex;flex-direction:column;gap:14px}
.mm-foot p{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sand2)}

/* ============ HERO ============ */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.hero-bg{position:absolute;inset:0;will-change:transform}
.hero-bg img{width:100%;height:100%;object-fit:cover;animation:kb 14s var(--ease) forwards}
@keyframes kb{from{transform:scale(1.14) translateY(-1.5%)}to{transform:scale(1)}}
.hero-g1,.hero-g2{position:absolute;inset:0;pointer-events:none}
.hero-g1{background:linear-gradient(to bottom,rgba(12,10,7,.7),rgba(12,10,7,.25),var(--ink))}
.hero-g2{background:linear-gradient(to right,rgba(12,10,7,.6),transparent)}
.side-label{position:absolute;top:50%;transform:translateY(-50%);z-index:2;display:none;pointer-events:none;writing-mode:vertical-rl;font-size:11px;font-weight:500;letter-spacing:.5em;text-transform:uppercase;color:var(--sand2)}
@media(min-width:1024px){.side-label{display:block}}
.side-r{right:24px}
.side-l{left:24px;transform:translateY(-50%) rotate(180deg)}
.hero-content{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:110px}
@media(min-width:768px){.hero-content{padding-top:128px}}
.hero-title{display:block}
.hl{display:block;overflow:hidden}
.hl-in{display:block;font-family:var(--d);font-weight:800;text-transform:uppercase;line-height:.95;transform:translateY(110%);animation:up 1.1s var(--ease) forwards}
@keyframes up{to{transform:none}}
.h-a{font-size:clamp(38px,9.2vw,140px);animation-delay:.55s}
.h-b{font-size:clamp(44px,10.6vw,160px);animation-delay:.7s}
.h-b .dot{-webkit-text-stroke:0;color:var(--gold)}
.hero-bottom{display:flex;flex-direction:column;gap:32px;margin-top:32px}
@media(min-width:768px){.hero-bottom{flex-direction:row;align-items:flex-end;justify-content:space-between;margin-top:48px}}
.hero-p{max-width:440px;font-size:16px;line-height:1.6;color:rgba(237,228,211,.8)}
@media(min-width:768px){.hero-p{font-size:18px}}
.hero-cta{display:flex;flex-wrap:wrap;gap:16px}
.hero-stats{position:relative;z-index:3;margin-top:56px;border-top:1px solid rgba(237,228,211,.15)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;flex-direction:column;gap:4px;padding:24px 0}
@media(min-width:768px){.stat{padding:32px 0}}
.stat:nth-child(odd){padding-right:16px}
.stat+.stat{border-left:1px solid rgba(237,228,211,.15);padding-left:20px}
.stat:nth-child(3){border-left:none;padding-left:0;border-top:1px solid rgba(237,228,211,.15)}
.stat:nth-child(4){border-top:1px solid rgba(237,228,211,.15)}
@media(min-width:768px){.stat:nth-child(3){border-top:none;border-left:1px solid rgba(237,228,211,.15);padding-left:32px}.stat:nth-child(4){border-top:none}}
@media(min-width:768px){.stat+.stat{padding-left:32px}}
.stat-v{font-family:var(--d);font-size:24px;font-weight:700;color:var(--gold)}
@media(min-width:768px){.stat-v{font-size:30px}}
.stat-l{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--sand2)}
.scroll-hint{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:3;display:none;flex-direction:column;align-items:center;gap:12px;color:var(--sand2)}
@media(min-width:1024px){.scroll-hint{display:flex}}
.scroll-hint svg{width:16px;height:16px}
.drop{display:block;width:1px;height:40px;background:linear-gradient(to bottom,var(--gold),transparent);animation:drop 2.2s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ============ БЕГУЩАЯ СТРОКА ============ */
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--coal);padding:16px 0}
@media(min-width:768px){.marquee{padding:24px 0}}
.mq-track{display:flex;width:max-content;animation:mq 36s linear infinite}
.mq-track:hover{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{display:flex;align-items:center;gap:24px;padding-right:24px;flex-shrink:0}
@media(min-width:768px){.mq-item{gap:40px;padding-right:40px}}
.mq-item span{font-family:var(--d);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
@media(min-width:768px){.mq-item span{font-size:24px}}
.mq-item svg{width:20px;height:20px;color:var(--gold)}
@media(min-width:768px){.mq-item svg{width:28px;height:28px}}

/* ============ ТУРЫ ============ */
.sec-head{display:flex;flex-direction:column;gap:32px}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.sec-p{max-width:400px;font-size:14px;line-height:1.7;color:rgba(237,228,211,.6)}
@media(min-width:768px){.sec-p{font-size:16px}}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.filter{border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sand2);transition:.3s}
.filter:hover{border-color:rgba(237,228,211,.4);color:var(--sand)}
.filter.on{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.grid-tours{display:grid;gap:24px;margin-top:40px}
@media(min-width:640px){.grid-tours{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-tours{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--coal);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .3s;animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(30px)}}
.card:hover{border-color:rgba(226,162,75,.5)}
.card-img{position:relative;aspect-ratio:16/10;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.card:hover .card-img img{transform:scale(1.1)}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--coal),transparent 55%,rgba(12,10,7,.3))}
.chip-region{position:absolute;top:16px;left:16px;z-index:2;background:rgba(12,10,7,.6);border:1px solid rgba(237,228,211,.2);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.chip-dur{position:absolute;top:16px;right:16px;z-index:2;background:var(--gold);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.card-num{position:absolute;right:16px;bottom:16px;z-index:2;writing-mode:vertical-rl;font-size:10px;font-weight:600;letter-spacing:.4em;color:rgba(237,228,211,.6);display:none}
@media(min-width:768px){.card-num{display:block}}
.card-body{display:flex;flex:1;flex-direction:column;gap:20px;padding:24px}
.card-title{font-family:var(--d);font-size:18px;font-weight:700;text-transform:uppercase;line-height:1.3;transition:color .3s}
.card:hover .card-title{color:var(--gold)}
@media(min-width:768px){.card-title{font-size:20px}}
.card-tag{font-size:14px;line-height:1.6;color:rgba(237,228,211,.6);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.params{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:12px 10px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;font-weight:600;color:rgba(237,228,211,.75)}
.params span{display:flex;align-items:center;gap:8px;min-width:0}
.params svg{width:14px;height:14px;flex-shrink:0;color:var(--gold)}
.diff{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--sand2)}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(237,228,211,.2)}
.dots i.on{background:var(--gold)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.from{font-size:10px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--sand2)}
.price{font-family:var(--d);font-size:20px;font-weight:700;color:var(--gold)}
.arrow-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);transition:.3s}
.arrow-btn svg{width:20px;height:20px;transition:transform .3s}
.card:hover .arrow-btn{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.card:hover .arrow-btn svg{transform:rotate(45deg)}

/* ============ МОДАЛКА ============ */
.modal{position:fixed;inset:0;z-index:70;background:rgba(12,10,7,.8);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;animation:fade .3s}
.modal.open{display:flex}
@keyframes fade{from{opacity:0}}
@media(min-width:768px){.modal{align-items:center;padding:32px}}
.modal-card{position:relative;width:100%;max-width:1024px;max-height:92svh;overflow-y:auto;background:var(--ink2);border:1px solid var(--line);border-radius:24px 24px 0 0;animation:mup .5s var(--ease)}
@keyframes mup{from{opacity:0;transform:translateY(60px)}}
@media(min-width:768px){.modal-card{border-radius:24px}}
.modal-close{position:absolute;top:16px;right:16px;z-index:2;background:rgba(12,10,7,.7);backdrop-filter:blur(8px)}
.modal-grid{display:grid}
@media(min-width:768px){.modal-grid{grid-template-columns:1.05fr 1fr}}
.modal-img{position:relative;height:240px;overflow:hidden}
@media(min-width:768px){.modal-img{height:auto;min-height:100%}}
.modal-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--ink2),rgba(12,10,7,.2),transparent)}
@media(min-width:768px){.modal-img::after{background:linear-gradient(to right,var(--ink2),rgba(12,10,7,.2),transparent)}}
.modal-img-cap{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
@media(min-width:768px){.modal-img-cap{left:32px;bottom:32px}}
.m-region{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.m-region svg{width:14px;height:14px}
.m-title{font-family:var(--d);font-size:24px;font-weight:700;text-transform:uppercase;line-height:1.15;margin-top:8px}
@media(min-width:768px){.m-title{font-size:30px}}
.modal-body{padding:24px}
@media(min-width:768px){.modal-body{padding:32px}}
.m-tag{font-size:14px;line-height:1.7;color:rgba(237,228,211,.75)}
.m-params{display:grid;grid-template-columns:1fr;gap:20px 16px;background:var(--coal);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px}
.kv label{display:block;font-size:11px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--sand2);margin-bottom:6px}
.kv .v{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.kv svg{width:16px;height:16px;flex-shrink:0;color:var(--gold)}
.bars{display:flex;gap:4px}
.bars i{width:28px;height:6px;border-radius:999px;background:rgba(237,228,211,.15)}
.bars i.on{background:var(--gold)}
.bars-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.m-route{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sand2)}
.m-route svg{width:16px;height:16px;color:var(--gold)}
.m-h{font-size:11px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin:24px 0 12px}
.hl-list li{display:flex;gap:10px;font-size:14px;color:rgba(237,228,211,.85);padding:4px 0}
.hl-list svg{width:16px;height:16px;flex-shrink:0;color:var(--gold);margin-top:2px}
.it-day{border-left:1px solid var(--line);padding-left:16px;margin-bottom:16px}
.it-day:last-child{margin-bottom:0}
.it-t{font-family:var(--d);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.it-t b{color:var(--gold);font-weight:600}
.it-p{font-size:13px;line-height:1.65;color:rgba(237,228,211,.65);margin-top:4px}
.inc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.inc span{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--coal);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;color:rgba(237,228,211,.8)}
.inc svg{width:12px;height:12px;color:var(--lake)}

function countryName(code){return COUNTRY_META[code].name[LANG];}
function plannerPlace(id){return PLACES.find(p=>p.id===id);}
function plannerSelectedPlaces(){return PLAN_SELECTED.map(plannerPlace).filter(Boolean);}
function plannerMessage(){
 const ui=PLANNER_UI[LANG];
 const selected=plannerSelectedPlaces();
 const cities=selected.length?[...new Set(selected.map(p=>p.city[LANG]))].join(', '):countryName(PLAN_COUNTRY);
 const places=selected.length?selected.map(p=>p.title[LANG]+' ('+p.city[LANG]+')').join(', '):ui.empty;
 return fill(ui.message,{country:countryName(PLAN_COUNTRY),cities:cities,places:places});
}
function mapY(p){return 20+p.y*.72;}
function plannerRouteD(points){
 if(!points.length)return '';
 const ordered=[...points];
 if(ordered.length===1)return '';
 let d=`M ${ordered[0].x*10} ${mapY(ordered[0])*7}`;
 for(let i=1;i<ordered.length;i++){
   const a=ordered[i-1],b=ordered[i];
   const y1=mapY(a)*7,y2=mapY(b)*7;
   const cx=(a.x+b.x)/2*10;
   d+=` Q ${cx} ${(y1+y2)/2-20} ${b.x*10} ${y2}`;
 }
 return d;
}
function renderMapVisual(){
 const shape=MAP_SHAPES[PLAN_COUNTRY];
 if(!shape)return;
 const wrap=$("mapShapeWrap");
 wrap.innerHTML=`<path class="map-shape" d="${shape.base}"/><path class="map-shape-core" d="${shape.core}"/><path class="map-shape-outline" d="${shape.base}"/>`+
 (shape.mini||[]).map(d=>`<path class="map-shape-mini" d="${d}"/>`).join('');
 const selectedSet=new Set(PLAN_SELECTED);
 const points=PLACES.filter(p=>p.country===PLAN_COUNTRY);
 $("mapPinsSvg").innerHTML=points.map(p=>{
   const cx=p.x*10,cy=mapY(p)*7,active=selectedSet.has(p.id);
   return `<g class="map-pin-svg ${active?'is-active':''}"><circle class="pin-pulse" cx="${cx}" cy="${cy}" r="${active?24:18}"/><circle class="pin-ring" cx="${cx}" cy="${cy}" r="${active?16:12}"/><circle class="pin-node ${active?'active':''}" cx="${cx}" cy="${cy}" r="${active?8.5:6.5}"/></g>`;
 }).join('');
 const selectedPoints=points.filter(p=>selectedSet.has(p.id));
 $("mapRoutePath").setAttribute('d', plannerRouteD(selectedPoints));
}

 $("natFeatures").innerHTML=n.feats.map((f,i)=>'<div class="feat rv"><span class="feat-ic">'+icons[i]+'</span><div><h3>'+f[0]+'</h3><p>'+f[1]+'</p></div><span class="feat-num">0'+(i+1)+'</span></div>').join("");
 $("cap1").textContent=n.cap1; $("cap2").textContent=n.cap2;
 $("chipV").textContent=n.chipV; $("chipL").textContent=n.chipL;
 $("natStats").innerHTML=n.stats.map(s=>'<div class="ns-cell rv"><p class="ns-v">'+s[0]+'<em>'+s[1]+'</em></p><p class="ns-l">'+s[2]+'</p></div>').join("");
}
function renderFaq(){

 $("faqOv").textContent=f.ov;

  '<div class="faq-a"'+(i===0?' style="max-height:400px"':"")+'><p>'+it[1]+'</p></div></div>').join("");
}

function renderContacts(){
 const c=T().con,t=T().labs;
 $("fOv").textContent=c.ov;
 $("fH2").innerHTML=c.a+' <br/><span class="outline-gold">'+c.b+'</span>';
 $("phoneBlock").href=WA_HREF(t.waG);
 $("phoneL").textContent=c.phoneL; $("phoneV").textContent=PHONE;

/* ================= МОДАЛКА ================= */
function openModal(id){
 const b=TOURS.find(t=>t.id===id);if(!b)return;
 const x=TXT(id),t=T().labs;
 const msg=fill(t.waT,{title:x.title,duration:''});
 const routeLabel=(LANG==='en'?'City':LANG==='kz'?'Қала':'Город');
 const askLabel=(LANG==='en'?'Discuss this route on WhatsApp':LANG==='kz'?'Осы маршрутты WhatsApp-та талқылау':'Обсудить этот маршрут в WhatsApp');
 $("modalCard").innerHTML=
 '<button class="icon-btn modal-close" aria-label="Close" data-close>'+IC.x+'</button>'+
 '<div class="modal-grid"><div class="modal-img">'+imgHTML(b.img,b.fallback,x.title,false)+
 '<div class="modal-img-cap"><p class="m-region">'+IC.pin+x.start+'</p><h3 class="m-title">'+x.title+'</h3></div></div>'+
 '<div class="modal-body"><p class="m-tag">'+x.tagline+'</p>'+
 '<div class="m-params">'+
 '<div class="kv"><label>'+routeLabel+'</label><span class="v">'+IC.pin+x.start+'</span></div>'+
 '</div>'+
 '<p class="m-h">'+t.waits+'</p><ul class="hl-list">'+x.highlights.map(h=>'<li>'+IC.chev+h+'</li>').join('')+'</ul>'+
 '<p class="m-h">'+t.program+'</p>'+x.itinerary.map(d=>'<div class="it-day"><p class="it-t">'+d.day+' — <b>'+d.t+'</b></p><p class="it-p">'+d.p+'</p></div>').join('')+
 '<div class="inc">'+x.included.map(i=>'<span>'+IC.check+i+'</span>').join('')+'</div>'+
 '<p class="modal-note">'+t.disclaimer+'</p>'+
 '<div class="price-cta"><p class="request-title">'+askLabel+'</p>'+
 '<a class="btn btn-gold" href="'+WA_HREF(msg)+'" target="_blank" rel="noopener noreferrer">'+IC.wa+t.book+'</a></div>'+
 '</div></div>';
 $("modal").classList.add("open");
 $("modal").setAttribute('role','dialog');$("modal").setAttribute('aria-modal','true');
 document.body.style.overflow="hidden";
 $("modalCard").querySelector('[data-close]').focus();
}
function closeModal(){ $("modal").classList.remove("open"); document.body.style.overflow=""; }

/* ================= АНИМАЦИИ ПОЯВЛЕНИЯ ================= */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:0.12,rootMargin:"0px 0px -40px 0px"});
function bindReveals(){ document.querySelectorAll(".rv:not(.in)").forEach((el,i)=>{el.style.transitionDelay=(i%6*0.06)+"s";io.observe(el)}); }

/* ================= РЕНДЕР ВСЕГО ================= */
function renderAll(){
 document.documentElement.lang=LANG==="kz"?"kk":LANG;
 document.title=T().title;
 renderLangSwitches();renderNav();renderHero();renderMarquee();renderFilters();
 renderCountries();renderTours();renderPlanner();renderNature();renderFaq();renderContacts();renderCredits();
 bindReveals();
}

/* ================= СОБЫТИЯ ================= */
document.addEventListener("click",e=>{
 const lg=e.target.closest("[data-lang]");
 if(lg){LANG=lg.dataset.lang;localStorage.setItem("ct-lang",LANG);closeModal();renderAll();return;}
 const country=e.target.closest("[data-country]");
 if(country){FILTER=country.dataset.country;renderFilters();renderTours();bindReveals();document.getElementById('tours').scrollIntoView({behavior:'smooth',block:'start'});return;}
 const f=e.target.closest("[data-filter]");
 if(f){FILTER=f.dataset.filter;renderFilters();renderTours();bindReveals();return;}
 const pc=e.target.closest("[data-plan-country]");
 if(pc){PLAN_COUNTRY=pc.dataset.planCountry;PLAN_SELECTED=[];renderPlanner();bindReveals();return;}
 const place=e.target.closest("[data-place]");
 if(place){
   const id=place.dataset.place;
   PLAN_SELECTED=PLAN_SELECTED.includes(id)?PLAN_SELECTED.filter(x=>x!==id):[...PLAN_SELECTED,id];
   renderPlanner();
   return;
 }
 const rem=e.target.closest("[data-remove-place]");
 if(rem){PLAN_SELECTED=PLAN_SELECTED.filter(x=>x!==rem.dataset.removePlace);renderPlanner();return;}
 if(e.target.id==="plannerReset"){PLAN_SELECTED=[];renderPlanner();return;}
 const card=e.target.closest("[data-card]");
 if(card){openModal(card.dataset.card);return;}
 const q=e.target.closest(".faq-q");
 if(q){
   const item=q.parentElement,ans=item.querySelector(".faq-a"),open=item.classList.contains("open");
   document.querySelectorAll(".faq-item.open").forEach(el=>{el.classList.remove("open");el.querySelector(".faq-a").style.maxHeight="0"});
   if(!open){item.classList.add("open");ans.style.maxHeight=ans.scrollHeight+"px";}
   return;
 }
 if(e.target.closest("[data-close]")||e.target.id==="modal"){closeModal();return;}
 const mmLink=e.target.closest(".mm-nav a");
 if(mmLink){$("mobileMenu").classList.remove("open");document.body.style.overflow="";return;}
});
$("burger").addEventListener("click",()=>{$("mobileMenu").classList.add("open");document.body.style.overflow="hidden"});
$("mmClose").addEventListener("click",()=>{$("mobileMenu").classList.remove("open");document.body.style.overflow=""});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&document.activeElement?.matches(".card[data-card]")){e.preventDefault();openModal(document.activeElement.dataset.card);return;}if(e.key==="Escape"){closeModal();$("mobileMenu").classList.remove("open");document.body.style.overflow=""}});

/* статичные иконки */
$("brandMark").innerHTML=IC.mountain;
$("brandMark2").innerHTML=IC.mountain;
$("burger").innerHTML=IC.menu;
$("mmClose").innerHTML=IC.x;
$("phoneIc").innerHTML=IC.phone;
$("shArr").innerHTML=IC.down;

/* шапка и параллакс */
const heroImg=$("heroImg");const colA=$("colA");const colB=$("colB");const natSec=$("nature");
let ticking=false;
function onScroll(){
  const y=window.scrollY;
  $("nav").classList.toggle("scrolled",y>40);
  if(heroImg&&y<window.innerHeight*1.2){heroImg.parentElement.style.transform="translateY("+(y*0.22)+"px)"}
  if(natSec){
    const r=natSec.getBoundingClientRect();const vh=window.innerHeight;
    const p=Math.min(1,Math.max(0,(vh-r.top)/(vh+r.height)));
    colA.style.transform="translateY("+(60-(p*120))+"px)";
    colB.style.transform="translateY("+(100-(p*200))+"px) rotate(2deg)";
  }
  ticking=false;
}
window.addEventListener("scroll",()=>{if(!ticking){requestAnimationFrame(onScroll);ticking=true}},{passive:true});

/* старт */
renderAll();
onScroll();
</script>
</body>
</html>
